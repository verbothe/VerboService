<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Programação do culto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#07090d;--s1:#0d1117;--s2:#131a24;--bd:rgba(255,255,255,.08);--bd2:rgba(255,255,255,.14);--tx:#e7ecf4;--mu:#8b97a8;--ac:#3b82f6;--cy:#22d3ee;--ok:#34d399;--ng:#fb7185;--g:linear-gradient(135deg,#2563eb,#0e7fc4);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;color:var(--tx);-webkit-font-smoothing:antialiased}
body:not(.s){background:radial-gradient(1100px 480px at 72% -8%,rgba(37,99,235,.2),transparent 62%),radial-gradient(800px 420px at 0% 100%,rgba(14,165,212,.09),transparent 60%),var(--bg);background-attachment:fixed}
body.s{background:transparent}
h1{font-size:22px;margin:0 0 8px;font-weight:600}
h2{font-size:17px;margin:0 0 4px;font-weight:600}
label{display:block;font-size:13px;font-weight:600;color:#b4bfce;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:rgba(255,255,255,.03);color:var(--tx);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:rgba(59,130,246,.7);box-shadow:0 0 0 3px rgba(59,130,246,.18)}
input::placeholder,textarea::placeholder{color:#5d6878}
input[type=checkbox]{width:auto}
textarea{resize:vertical}
button{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid rgba(59,130,246,.5);background:rgba(59,130,246,.08);color:#9cc2ff;cursor:pointer;transition:.15s}
button:hover{background:rgba(59,130,246,.18)}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
button.p{background:var(--g);border-color:transparent;color:#fff;box-shadow:0 4px 16px rgba(37,99,235,.28)}
button.p:hover{filter:brightness(1.12)}
button.g{background:rgba(255,255,255,.03);border-color:var(--bd2);color:var(--tx)}
button.g:hover{background:rgba(255,255,255,.08)}
button.r{background:rgba(251,113,133,.06);border-color:rgba(251,113,133,.4);color:var(--ng)}
button.r:hover{background:rgba(251,113,133,.15)}
.shell{min-height:100vh}
.rail{position:fixed;left:0;top:0;bottom:0;width:64px;background:rgba(13,17,23,.88);backdrop-filter:blur(14px);border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;z-index:6}
.rail .lg{width:36px;height:36px;border-radius:11px;background:var(--g);display:grid;place-items:center;font-weight:700;color:#fff;margin-bottom:12px;box-shadow:0 0 20px rgba(37,99,235,.45)}
.rail .sp{flex:1}
.rail button{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:12px;background:transparent;color:var(--mu)}
.rail button:hover{color:var(--tx);background:rgba(255,255,255,.06)}
.rail button.on{color:#fff;background:rgba(59,130,246,.16);border-color:rgba(59,130,246,.45);box-shadow:0 0 14px rgba(59,130,246,.25)}
.rail button:disabled{opacity:.3;cursor:default;background:transparent}
.rail svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pane{margin-left:64px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 24px;min-height:60px;background:rgba(7,9,13,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
header b{font-size:15px;font-weight:600}
header #sair{display:none}
main{max-width:1040px;margin:0 auto;padding:24px}
.box{max-width:380px;margin:12vh auto;padding:28px;background:var(--s1);border:1px solid var(--bd2);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>input,.row>select{flex:1;min-width:110px;width:auto}
.b2{display:flex;gap:6px}
.err{color:var(--ng);font-size:14px;min-height:20px}
.vz,.tot{color:var(--mu);font-size:13.5px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:20px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}
.cal{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
.cal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:600}
.cal .hd>span:first-child::first-letter{text-transform:uppercase}
.cal .hd button{padding:3px 10px;font-size:15px}
.cal table{width:100%;border-collapse:collapse;text-align:center}
.cal th{font-size:10.5px;letter-spacing:.8px;color:var(--mu);padding:5px 0;font-weight:600}
.cal td{padding:1px 0}
.cal td span{display:flex;flex-direction:column;align-items:center;justify-content:center;width:36px;height:38px;margin:auto;border-radius:12px;cursor:pointer;font-size:14px;transition:.15s}
.cal td span:hover{background:rgba(255,255,255,.07)}
.cal td span.o{color:#4a5566}
.cal td span.hj{box-shadow:inset 0 0 0 1px var(--cy);color:var(--cy)}
.cal td span.sl{background:var(--g);color:#fff;font-weight:700;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.cal td span i{width:5px;height:5px;border-radius:50%;background:var(--cy);margin-top:1px}
.cal td span.sl i{background:#fff}
.cal td span i.x{visibility:hidden}
.l{list-style:none;padding:0;margin:0 0 10px}
.l li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:14px 16px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;cursor:pointer;transition:.15s}
.l li:hover{border-color:rgba(59,130,246,.45);background:var(--s2);transform:translateY(-1px)}
.l small{display:block;color:var(--cy);margin-top:3px;font-weight:600;font-variant-numeric:tabular-nums}
.pal{display:flex;gap:8px;margin:0 0 14px}
.pal button{flex:1;display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.03);border-color:var(--bd2);color:var(--tx)}
.pal kbd{background:rgba(255,255,255,.06);border:1px solid var(--bd2);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mu);font-family:inherit}
.it{display:grid;grid-template-columns:22px 58px 1fr 84px auto;gap:8px;align-items:center;margin-bottom:8px;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:8px 10px 8px 12px;position:relative;transition:.15s}
.it::before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--g)}
.it:hover{border-color:var(--bd2);background:var(--s2)}
.it.h{background:linear-gradient(90deg,rgba(37,99,235,.24),rgba(14,165,212,.05));border-color:rgba(59,130,246,.35)}
.it.h::before{background:var(--cy)}
.it.h .nm{font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:13px}
.it.dg{z-index:3;border-color:var(--cy);opacity:.9;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.it.ov{box-shadow:0 -4px 0 var(--cy)}
.it .gr{cursor:grab;touch-action:none;text-align:center;color:var(--mu);user-select:none;font-size:18px}
.it .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--cy);font-size:14px}
.it input{background:transparent;border-color:transparent;padding:8px}
.it input:hover{border-color:var(--bd)}
.it input:focus{background:rgba(255,255,255,.04)}
.it .mn{text-align:center;font-variant-numeric:tabular-nums}
.it .b{display:flex;gap:4px}
.it .b button{padding:6px 9px;font-size:13px;border-radius:9px}
.agora{position:relative;background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--bd2);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 14px 44px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);overflow:hidden}
.agora::after{content:"";position:absolute;right:-70px;top:-70px;width:240px;height:240px;background:radial-gradient(circle,rgba(34,211,238,.18),transparent 65%);pointer-events:none}
.agora .lb{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--cy);font-weight:600}
.cur{font-size:20px;font-weight:600;margin:4px 0 0}
.nxt{color:var(--mu);margin:2px 0 6px;font-size:14px}
.cd{font-size:clamp(48px,10vw,76px);font-weight:600;font-variant-numeric:tabular-nums;color:var(--ok);line-height:1.05;letter-spacing:-1.5px;cursor:text;touch-action:manipulation}
.cd.neg{color:var(--ng)}
.ctl{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.ctl button{height:40px;padding:0 15px;font-size:13.5px}
.ctl .p{flex:1 1 140px}
.pl{list-style:none;padding:0;margin:0}
.pl li{padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--s1);margin-bottom:6px;display:flex;justify-content:space-between;font-size:14px}
.pl li span+span{color:var(--mu);font-variant-numeric:tabular-nums}
.pl li.on{border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.08);font-weight:600}
#lk{font-size:12px;word-break:break-all;color:var(--mu);margin-top:8px}
.ck{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--tx);margin:10px 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:5px 11px;font-size:13px;border-radius:999px}
#jn{position:fixed;inset:0;z-index:20}
#jn .bk{position:absolute;inset:0;background:rgba(2,4,8,.66);backdrop-filter:blur(4px)}
#jn aside{position:absolute;background:var(--s1);border:1px solid var(--bd2);padding:20px;overflow:auto;box-shadow:0 20px 70px rgba(0,0,0,.6)}
#jn.lado aside{top:0;right:0;bottom:0;width:min(400px,100%);border-width:0 0 0 1px;animation:entra .2s ease}
#jn.centro aside{top:50%;left:50%;transform:translate(-50%,-50%);width:min(430px,92%);max-height:90vh;border-radius:18px;animation:fade .18s ease}
@keyframes entra{from{transform:translateX(26px);opacity:0}}
@keyframes fade{from{opacity:0}}
button:disabled{opacity:.4;cursor:default}
.us{display:grid;grid-template-columns:1fr 170px auto;gap:10px;align-items:center;background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.us.bl{opacity:.7;border-color:rgba(251,113,133,.35)}
.us small{display:block;color:var(--mu);margin-top:2px}
@media(max-width:560px){.us{grid-template-columns:1fr}}
@media(max-width:820px){
  .rail{top:auto;right:0;width:auto;height:60px;flex-direction:row;justify-content:space-around;padding:0 10px;border-right:0;border-top:1px solid var(--bd)}
  .rail .lg,.rail .sp{display:none}
  .pane{margin-left:0;padding-bottom:76px}
  .grid{grid-template-columns:1fr}
  header{padding:10px 14px}main{padding:16px 14px}
}
@media(max-width:560px){
  .it{grid-template-columns:20px 46px 1fr 62px}
  .it .b{grid-column:1/-1;justify-content:flex-end}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#out{position:fixed;inset:0;display:none;flex-direction:column;background:transparent}
#out iframe{flex:1;min-height:0;width:100%;border:0;background:transparent}
#lt{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;flex:none;margin-top:auto;display:flex;align-items:center;gap:2.5em;padding:.9em 2.5em .9em 1.6em;border-top:.8em solid #2d6a4f;font-size:calc(var(--s,1)*1vw);line-height:1.1}
#lt.neg{border-top-color:#d93a25}
#lt.claro{background:#fff;color:#161816}
#lt.escuro{background:#121413;color:#fff}
#lt.topo{order:-1;margin-top:0;border-top:0;border-bottom:.8em solid #2d6a4f}
#lt.topo.neg{border-bottom-color:#d93a25}
#lt .k{display:flex;flex-direction:column;align-items:flex-start;gap:.3em}
#lt .c{font-size:10em;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;color:#2d6a4f;white-space:nowrap}
#lt .c.neg{color:#d93a25}
#lt .f{font-size:1.9em;opacity:.7;white-space:nowrap}
#lt .n{font-size:2.8em;opacity:.7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="out"><iframe id="fr" allow="autoplay"></iframe><div id="lt"><div class="k"><div class="c" id="cr"></div><div class="f" id="fn"></div></div><div class="n" id="nx"></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const SB_URL='https://lnbunuppttmcrqhxalpp.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxuYnVudXBwdHRtY3JxaHhhbHBwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIyNjI4NDAsImV4cCI6MjEwNzgzODg0MH0.RXTVze45uxDJBn8j9KcuKrgDtPB72nbSGIxanb3bCi8';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{const a=Math.abs(Math.round(s));return Math.floor(a/60)+':'+String(a%60).padStart(2,'0')};
const hm=m=>{m=Math.round(m)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const toMin=t=>{const [h,m]=t.split(':');return +h*60+ +m};
const P=new URLSearchParams(location.search);
let vista='',atual=null,papel='operador';
const AP=$('#app'),IH=Object.getOwnPropertyDescriptor(Element.prototype,'innerHTML');
const ico={
  lista:'<svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  culto:'<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>',
  live:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>',
  usuarios:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8.5" r="3.5"/><path d="M2.5 20c.6-3.6 3.3-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 5.3a3.5 3.5 0 0 1 0 6.4M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>',
  sair:'<svg viewBox="0 0 24 24"><path d="M9 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H9M15 8l4 4-4 4M19 12H9"/></svg>'
};
const rail=()=>'<nav class="rail"><div class="lg">V</div>'+[['lista','Programação'],['culto','Cronograma'],['live','Ao vivo']].concat(papel==='admin'?[['usuarios','Usuários']]:[]).map(([k,t])=>`<button data-nav="${k}" title="${t}" aria-label="${t}" class="${vista===k?'on':''}"${k!=='lista'&&k!=='usuarios'&&!atual?' disabled':''}>${ico[k]}</button>`).join('')+`<div class="sp"></div><button data-nav="sair" title="Sair" aria-label="Sair">${ico.sair}</button></nav>`;
Object.defineProperty(AP,'innerHTML',{get(){return IH.get.call(AP)},set(v){IH.set.call(AP,v.includes('class="box"')?v:rail()+'<div class="pane">'+v+'</div>')}});
AP.addEventListener('click',async e=>{
  const b=e.target.closest('[data-nav]');if(!b||b.disabled)return;
  const k=b.dataset.nav;
  if(k==='lista')lista();else if(k==='culto')culto(atual);else if(k==='live')live(atual);else if(k==='usuarios')usuarios();
  else{await sb.auth.signOut();atual=null;papel='operador';login()}
});
let bloqueado=false;
async function carregarPapel(){
  papel='operador';bloqueado=false;
  try{
    const {data:{user}}=await sb.auth.getUser();if(!user)return;
    let r=await sb.from('perfis').select('papel,ativo').eq('user_id',user.id).maybeSingle();
    if(r.error)r=await sb.from('perfis').select('papel').eq('user_id',user.id).maybeSingle();
    const d=r.data;
    if(d){if(d.ativo===false)bloqueado=true;else if(d.papel==='admin')papel='admin'}
  }catch(e){}
}
let timer;
const ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
let selD=ds(new Date()),cur=new Date();cur.setDate(1);
let painel=false,foco=false;
const irLista=d=>{selD=d;const x=new Date(d+'T00:00:00');cur=new Date(x.getFullYear(),x.getMonth(),1);lista()};

if(P.get('saida'))saida(P.get('saida'));else admin();

function janela(tipo,html){
  fechar();
  const d=document.createElement('div');d.id='jn';d.className=tipo;
  d.innerHTML='<div class="bk"></div><aside>'+html+'</aside>';
  document.body.appendChild(d);
  d.querySelector('.bk').onclick=fechar;
  return d;
}
function fechar(){const d=document.getElementById('jn');if(d)d.remove()}
function painelItem(i,cb){
  const h=i.tipo==='header';
  janela('lado',`<h2>${h?'Cabeçalho':'Item'}</h2><label>Nome<input id="dn"></label>${h?'':`<label>Duração (minutos)<input id="dm" type="number" min="0" step="0.5"></label><label>Observações<textarea id="do" rows="9" placeholder="Texto que aparece abaixo do item no PDF"></textarea></label>`}<div class="row"><button class="p" id="ds">Salvar</button><button class="g" id="dc">Fechar</button></div>`);
  $('#dn').value=i.nome;
  if(!h){$('#dm').value=i.minutos;$('#do').value=i.notas||''}
  $('#dn').focus();$('#dn').select();
  $('#dc').onclick=fechar;
  $('#ds').onclick=async()=>{
    const f={nome:$('#dn').value.trim()||i.nome};
    if(!h){f.minutos=+$('#dm').value||0;f.notas=$('#do').value}
    const {error}=await sb.from('itens').update(f).eq('id',i.id);
    if(error){alert(`Não foi possível salvar: ${error.message}\nSe citar "notas", rode no Supabase: alter table itens add column if not exists notas text;`);return}
    fechar();cb();
  };
}
const fmtD=m=>{const t=Math.round(Number(m)*60);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')};
const san=v=>String(v??'').replace(/→/g,'->');
async function pdfJanela(id){
  const [a,b]=await Promise.all([sb.from('cultos').select('*').eq('id',id).single(),sb.from('itens').select('*').eq('culto_id',id).order('ordem')]);
  const c=a.data,it=b.data||[];
  let o={hor:true,dur:true,obs:true,fs:11};
  try{Object.assign(o,JSON.parse(localStorage.getItem('pdf-cfg')||'{}'))}catch(e){}
  janela('centro',`<h2>Baixar PDF</h2><p class="vz">${esc(c.nome)}</p>
  <label class="ck"><input type="checkbox" id="p1"${o.hor?' checked':''}> Mostrar horários</label>
  <label class="ck"><input type="checkbox" id="p2"${o.dur?' checked':''}> Mostrar duração (minutos)</label>
  <label class="ck"><input type="checkbox" id="p3"${o.obs?' checked':''}> Mostrar observações</label>
  <label>Tamanho da letra<select id="p4">${[10,11,12,14].map(n=>`<option${n==o.fs?' selected':''}>${n}</option>`).join('')}</select></label>
  <div class="row"><button class="p" id="pb">Baixar PDF</button><button class="g" id="pc">Cancelar</button></div>`);
  $('#pc').onclick=fechar;
  $('#pb').onclick=()=>{
    o={hor:$('#p1').checked,dur:$('#p2').checked,obs:$('#p3').checked,fs:+$('#p4').value};
    try{localStorage.setItem('pdf-cfg',JSON.stringify(o))}catch(e){}
    fechar();gerarPDF(c,it,o);
  };
}
function gerarPDF(c,it,o){
  if(!window.jspdf){alert('Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.');return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  const W=210,H=297,M=15,fs=o.fs,lh=fs*0.3528*1.4;
  let y=M;
  const pg=n=>{if(y+n>H-M){doc.addPage();y=M}};
  doc.setFont('helvetica','bold');doc.setFontSize(24);
  doc.splitTextToSize(san(c.nome),W-2*M).forEach(l=>{y+=9;doc.text(l,W/2,y,{align:'center'})});
  y+=4;doc.setLineDashPattern([1,1],0);doc.setLineWidth(.2);doc.setDrawColor(0);doc.line(M,y,W-M,y);doc.setLineDashPattern([],0);
  y+=8;doc.setFontSize(14);

    ed.onkeydown=e=>{if(e.key==='Enter')ed.blur();if(e.key==='Escape'){edit=false;draw()}};
  }
  $('#cd').onclick=()=>{const n=Date.now();if(n-ult<400)editar();ult=n};
  draw();timer=setInterval(draw,250);
}
async function saida(id){
  document.body.classList.add('s');
  $('#app').style.display='none';$('#out').style.display='flex';
  let url=(P.get('url')||'').trim();
  if(!url){try{const r=await sb.from('config').select('valor').eq('chave','fundo').maybeSingle();url=((r.data&&r.data.valor)||'').trim()}catch(e){}}
  if(url&&!/^[a-z][a-z0-9+.-]*:\/\//i.test(url))url='http://'+url;
  if(url&&!/^https?:\/\//i.test(url))url='';
  let ruim=false;
  try{const u=new URL(url||'about:blank',location.href);ruim=u.searchParams.has('saida')||(u.origin===location.origin&&u.pathname===location.pathname)}catch(e){ruim=true}
  if(url&&!ruim)$('#fr').src=url;else $('#fr').remove();
  $('#lt').className=(P.get('tema')==='claro'?'claro':'escuro')+(P.get('pos')==='topo'?' topo':'');
  $('#lt').style.setProperty('--s',+P.get('escala')||1);
  let it=[],st={idx:0,t0:null},fim='';
  async function carregar(){
    const [a,b,c]=await Promise.all([sb.from('itens').select('*').eq('culto_id',id).order('ordem'),sb.from('live_state').select('*').eq('culto_id',id).maybeSingle(),sb.from('cultos').select('hora_inicio').eq('id',id).maybeSingle()]);
    it=(a.data||[]).filter(x=>x.tipo!=='header');const s=b.data;
    if(s&&(s.tema==='claro'||s.tema==='escuro')){const l=$('#lt');l.classList.remove('claro','escuro');l.classList.add(s.tema)}
    st=s?{idx:s.idx,t0:s.t0?new Date(s.t0).getTime():null}:{idx:0,t0:null};
    fim=c.data?hm(toMin(c.data.hora_inicio.slice(0,5))+it.reduce((x,y)=>x+Number(y.minutos),0)):'';
  }
  function draw(){
    const i=it[st.idx],lt=$('#lt');
    if(!i){$('#cr').textContent='';$('#nx').textContent='';$('#fn').textContent='';return}
    const rem=i.minutos*60-(st.t0?(Date.now()-st.t0)/1000:0);
    $('#cr').textContent=(rem<0?'-':'')+fmt(rem);
    $('#cr').classList.toggle('neg',rem<0);lt.classList.toggle('neg',rem<0);
    $('#fn').textContent=fim?'serviço finaliza às '+fim:'';
    const n=it[st.idx+1];
    $('#nx').textContent=n?'A seguir: '+n.nome:'Último item';
  }
  await carregar();
  sb.channel('l'+id).on('postgres_changes',{event:'*',schema:'public',table:'live_state',filter:'culto_id=eq.'+id},carregar).subscribe();
  setInterval(carregar,10000);
  setInterval(draw,250);draw();
}
</script>
