<style>
:root{--bg:#F5F2EA;--s1:#FFFFFF;--s2:#EBF0EC;--bd:rgba(23,43,58,.10);--bd2:rgba(23,43,58,.18);--tx:#172B3A;--mu:#5B6B75;--az:#172B3A;--sg:#6C998A;--sg2:#3F6F5F;--du:#D5A95F;--ng:#B4503C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;color:var(--tx);-webkit-font-smoothing:antialiased}
body:not(.s){background:var(--bg)}
body.s{background:transparent}
h1,h2,header b,.cur,.marca b{font-family:Manrope,"DM Sans",system-ui,sans-serif;letter-spacing:-.01em}
h1{font-size:22px;margin:0 0 8px;font-weight:800}
h2{font-size:17px;margin:0 0 4px;font-weight:700}
label{display:block;font-size:13px;font-weight:600;color:#3d4f5b;margin:14px 0 6px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--bd2);border-radius:10px;background:#fff;color:var(--tx);transition:.15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--sg);box-shadow:0 0 0 3px rgba(108,153,138,.28)}
input::placeholder,textarea::placeholder{color:#8a97a0}
input[type=checkbox]{width:auto;accent-color:var(--az)}
textarea{resize:vertical}
button{font:inherit;font-weight:600;font-size:14px;padding:9px 14px;border-radius:10px;border:1px solid var(--sg);background:rgba(108,153,138,.12);color:var(--sg2);cursor:pointer;transition:.15s}
button:hover{background:rgba(108,153,138,.22)}
button:focus-visible{outline:2px solid var(--sg);outline-offset:2px}
button.p{background:var(--az);border-color:var(--az);color:var(--bg)}
button.p:hover{background:#22405a}
button.g{background:#fff;border-color:var(--bd2);color:var(--tx)}
button.g:hover{background:var(--s2)}
button.r{background:#fff;border-color:rgba(180,80,60,.45);color:var(--ng)}
button.r:hover{background:rgba(180,80,60,.08)}
button:disabled{opacity:.4;cursor:default}
.shell{min-height:100vh}
.rail{position:fixed;left:0;top:0;bottom:0;width:64px;background:var(--az);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0;z-index:6}
.rail .lg{width:40px;height:40px;margin-bottom:12px}
.rail .lg img{width:40px;height:40px;border-radius:11px;display:block}
.rail .sp{flex:1}
.rail button{width:42px;height:42px;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:12px;background:transparent;color:#9fb1bd}
.rail button:hover{color:var(--bg);background:rgba(255,255,255,.08)}
.rail button.on{color:var(--du);background:rgba(213,169,95,.14);border-color:rgba(213,169,95,.45)}
.rail button:disabled{opacity:.3;background:transparent}
.rail svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.pane{margin-left:64px;min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 24px;min-height:60px;background:rgba(245,242,234,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
header b{font-size:15px;font-weight:700}

main{max-width:1040px;margin:0 auto;padding:24px}
.box{max-width:380px;margin:12vh auto;padding:28px;background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 16px 50px rgba(23,43,58,.12)}
.marca{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.marca img{width:48px;height:48px;border-radius:13px}
.marca b{display:block;font-size:24px;font-weight:800;line-height:1}
.marca span{font-size:11px;letter-spacing:.32em;color:var(--sg2);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row>input,.row>select{flex:1;min-width:110px;width:auto}
.b2{display:flex;gap:6px}
.err{color:var(--ng);font-size:14px;min-height:20px}
.vz,.tot{color:var(--mu);font-size:13.5px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:16px;padding:18px;margin-top:20px}
.grid{display:grid;grid-template-columns:290px 1fr;gap:22px;align-items:start}
.cal{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 6px 24px rgba(23,43,58,.06)}

.cal table{width:100%;border-collapse:collapse;text-align:center}

.cal td span i.x{visibility:hidden}
.l{list-style:none;padding:0;margin:0 0 10px}

.pal{display:flex;gap:8px;margin:0 0 14px}

.it{display:grid;grid-template-columns:20px 46px 50px 1fr auto;gap:8px;align-items:start;margin-bottom:4px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:7px 8px 7px 6px;position:relative;cursor:pointer;transition:.15s}
.it:hover{border-color:var(--bd2);background:#fbfaf6}
.it.h{grid-template-columns:20px 1fr auto auto;align-items:center;background:var(--s2);border-color:rgba(108,153,138,.45);padding:5px 8px 5px 6px}
.it.h::before{content:"";position:absolute;left:-1px;top:6px;bottom:6px;width:3px;border-radius:3px;background:var(--du)}
.it .hn{font-size:12.5px;text-transform:uppercase;letter-spacing:.6px;font-weight:800}
.it .ht{font-size:12px;color:var(--mu);font-weight:600}
.it.dg{z-index:3;border-color:var(--sg);opacity:.92;box-shadow:0 10px 30px rgba(23,43,58,.2)}
.it.ov{box-shadow:0 -3px 0 var(--du)}
.it .gr{cursor:grab;touch-action:none;text-align:center;color:var(--mu);user-select:none;font-size:15px;line-height:1.5}
.it .t{font-variant-numeric:tabular-nums;font-size:13px;color:var(--mu);font-weight:600;line-height:1.5}
.it .ln{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;line-height:1.5}
.it .bd b{font-size:14px;font-weight:700;line-height:1.5}
.it .ds{font-size:12.5px;color:var(--mu);white-space:pre-wrap;line-height:1.4;margin-top:1px}

.it:hover .b,.it:focus-within .b{opacity:1}
@media(hover:none){.it .b{opacity:1}}
.it .b button{padding:1px 7px;font-size:12px;border-radius:7px;line-height:1.5}
.addw{position:relative;display:inline-block;margin:2px 0 12px}
.addp{position:absolute;z-index:8;top:calc(100% + 6px);left:0;width:min(300px,86vw);background:#fff;border:1px solid var(--bd2);border-radius:14px;box-shadow:0 14px 40px rgba(23,43,58,.18);padding:12px}
.addp .pt{text-align:center;font-weight:700;font-size:13px;margin-bottom:10px}
.pe{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--bd2);border-radius:10px;margin-bottom:8px;cursor:grab;touch-action:none;user-select:none;font-weight:600;font-size:14px;background:#fff}
.pe:last-child{margin-bottom:0}
.pe span:nth-child(2){flex:1}
.pe .pg{color:var(--mu)}
.pe kbd{background:var(--s2);border:1px solid var(--bd2);border-radius:6px;padding:1px 7px;font-size:12px;color:var(--mu);font-family:inherit}
.pe.gh{position:fixed;z-index:60;pointer-events:none;width:210px;box-shadow:0 12px 30px rgba(23,43,58,.25);opacity:.95}

.agora{position:relative;background:var(--az);color:var(--bg);border-radius:18px;padding:20px 22px;margin-bottom:16px;box-shadow:0 14px 40px rgba(23,43,58,.28);overflow:hidden}

.cur{font-size:20px;font-weight:700;margin:4px 0 0}
.nxt,.agora .tot{color:#A9B7BF;margin:2px 0 6px;font-size:14px}
.cd{font-family:Manrope,"DM Sans",sans-serif;font-size:clamp(48px,10vw,76px);font-weight:700;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";color:#43D17E;line-height:1.05;letter-spacing:-1.5px;cursor:text;touch-action:manipulation}

.agora input{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.3);color:var(--bg)}
.ctl{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}

.ctl .p{flex:1 1 140px;background:var(--du);border-color:var(--du);color:var(--az)}
.ctl .p:hover{background:#dfb86f}
.agora .g{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.22);color:var(--bg)}
.agora .g:hover{background:rgba(255,255,255,.16)}
.pl{list-style:none;padding:0;margin:0}
.pl li{padding:10px 14px;border:1px solid var(--bd);border-radius:12px;background:#fff;margin-bottom:6px;display:flex;justify-content:space-between;font-size:14px}
.pl li span+span{color:var(--mu);font-variant-numeric:tabular-nums}
.pl li.on{border-color:var(--sg);background:#E3ECE6;font-weight:700}
#lk{font-size:12px;word-break:break-all;color:var(--mu);margin-top:8px}
.ck{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--tx);margin:10px 0;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chips button{padding:5px 11px;font-size:13px;border-radius:999px}
.us{display:grid;grid-template-columns:1fr 170px auto;gap:10px;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.us.bl{opacity:.75;border-color:rgba(180,80,60,.4)}
.us small{display:block;color:var(--mu);margin-top:2px}

#jn .bk{position:absolute;inset:0;background:rgba(23,43,58,.5);backdrop-filter:blur(3px)}

#jn.lado aside{top:0;right:0;bottom:0;width:min(400px,100%);border-width:0 0 0 1px;animation:entra .2s ease}
#jn.centro aside{top:50%;left:50%;transform:translate(-50%,-50%);width:min(430px,92%);max-height:90vh;border-radius:18px;animation:fade .18s ease}
@keyframes entra{from{transform:translateX(26px);opacity:0}}
@keyframes fade{from{opacity:0}}
@media(max-width:820px){

function janela(tipo,html){

  d.innerHTML='<div class="bk"></div><aside>'+html+'</aside>';
  document.body.appendChild(d);

  return d;
}
function fechar(){const d=document.getElementById('jn');if(d)d.remove()}
function painelItem(i,cb){
  const h=i.tipo==='header';
  janela('lado',`<h2>${h?'Cabeçalho':'Item'}</h2><label>Título<input id="dn"></label>${h?'':`<label>Duração (minutos)<input id="dm" type="number" min="0" step="0.5"></label><label>Descrição<textarea id="do" rows="9" placeholder="Detalhes deste momento. Aparecem abaixo do título na lista e no PDF"></textarea></label>`}<div class="row"><button class="p" id="ds">Salvar</button><button class="g" id="dc">Fechar</button></div>`);
  $('#dn').value=i.nome;
  if(!h){$('#dm').value=i.minutos;$('#do').value=i.notas||''}
  $('#dn').focus();$('#dn').select();
  $('#dc').onclick=fechar;
  $('#ds').onclick=async()=>{
    const f={nome:$('#dn').value.trim()||i.nome};
    if(!h){f.minutos=+$('#dm').value||0;f.notas=$('#do').value}

    if(error){alert(`Não foi possível salvar: ${error.message}\nSe citar "notas", rode no Supabase: alter table itens add column if not exists notas text;`);return}
    fechar();cb();
  };
}

async function pdfJanela(id){

  <label>Tamanho da letra<select id="p4">${[10,11,12,14].map(n=>`<option${n==o.fs?' selected':''}>${n}</option>`).join('')}</select></label>
  <div class="row"><button class="p" id="pb">Baixar PDF</button><button class="g" id="pc">Cancelar</button></div>`);

    try{localStorage.setItem('pdf-cfg',JSON.stringify(o))}catch(e){}
    fechar();gerarPDF(c,it,o);
  };
}
function gerarPDF(c,it,o){
  if(!window.jspdf){alert('Não foi possível carregar o gerador de PDF. Verifique a internet e tente de novo.');return}
  const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'});
  doc.setTextColor(23,43,58);
  const W=210,H=297,M=15,fs=o.fs,lh=fs*0.3528*1.4;
  let y=M;
  const pg=n=>{if(y+n>H-M){doc.addPage();y=M}};
  doc.setFont('helvetica','bold');doc.setFontSize(24);
  doc.splitTextToSize(san(c.nome),W-2*M).forEach(l=>{y+=9;doc.text(l,W/2,y,{align:'center'})});
  y+=4;doc.setLineDashPattern([1,1],0);doc.setLineWidth(.2);doc.setDrawColor(23,43,58);doc.line(M,y,W-M,y);doc.setLineDashPattern([],0);
  y+=8;doc.setFontSize(14);
  doc.text(new Date(c.data+'T00:00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}),W/2,y,{align:'center'});
  y+=12;
  const xT=M+2,xD=xT+(o.hor?18:0),xN=xD+(o.dur?18:0),wN=W-M-2-xN;
  doc.setFontSize(fs);
  if(o.hor||o.dur){
    doc.setFont('helvetica','bold');
    if(o.hor){doc.text(c.data.slice(8)+'/'+c.data.slice(5,7),xT,y);doc.text(c.hora_inicio.slice(0,5),xT,y+lh)}
    if(o.dur){doc.text('Duração',xD,y);doc.text('em min',xD,y+lh)}
    y+=lh*2+4;
  }
  let m=toMin(c.hora_inicio.slice(0,5)),tot=0;
  it.forEach(i=>{
    doc.setFontSize(fs);
    if(i.tipo==='header'){
      pg(lh+8);
      doc.setFillColor(230,237,232);doc.rect(M,y-lh+0.5,W-2*M,lh+2.5,'F');
      doc.setFont('helvetica','bold');doc.text(san(i.nome).toUpperCase(),xT,y);y+=lh+4;return;
    }
    doc.setFont('helvetica','bold');
    const nm=doc.splitTextToSize(san(i.nome),wN);
    doc.setFont('helvetica','normal');
    const nt=o.obs&&i.notas?san(i.notas).split('\n').flatMap(l=>doc.splitTextToSize(l||' ',wN-3)):[];
    const n=nm.length+nt.length;
    pg(lh*n+4);
    doc.setFont('helvetica','normal');
    if(o.hor)doc.text(hm(m),xT,y);
    doc.setFont('helvetica','bold');
    if(o.dur)doc.text(fmtD(i.minutos),xD,y);
    nm.forEach((l,k)=>doc.text(l,xN,y+k*lh));
    doc.setFont('helvetica','normal');
    nt.forEach((l,k)=>doc.text(l,xN+3,y+(nm.length+k)*lh));
    y+=lh*(n-1)+2.5;
    doc.setDrawColor(215);doc.setLineWidth(.15);doc.line(M,y,W-M,y);
    y+=lh*.95;
    m+=Number(i.minutos);tot+=Number(i.minutos);
  });
  pg(lh+4);
  doc.setDrawColor(23,43,58);doc.setLineWidth(.5);doc.line(M,y-lh*.95,W-M,y-lh*.95);
  doc.setFontSize(fs);doc.setFont('helvetica','normal');
  if(o.hor)doc.text(hm(m),xT,y);
  doc.setFont('helvetica','bold');
  if(o.dur)doc.text(fmtD(tot),xD,y);
  doc.text('Total',xN,y);
  const nome=(c.nome+' - '+c.data.split('-').reverse().join('-')).replace(/[\\/:*?"<>|]/g,'');
  doc.save(nome+'.pdf');
}

const OLHO='<svg viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const ERR_LOGIN={'Invalid login credentials':'E-mail ou senha incorretos.','Email not confirmed':'E-mail ainda não confirmado no Supabase.'};
const ladoHTML=()=>`<aside class="lado"><i class="bolha a"></i><i class="bolha d"></i><div class="tile"><div class="logo"><img class="lv" src="${LOGO.livro}" alt=""><img class="sl" src="${LOGO.sol}" alt=""></div></div><div class="nome"><b>Verbo</b><span>SERVICE</span></div><p class="lema">Cultos em ordem. Serviço em unidade.</p><div class="prox" id="prox" hidden></div></aside>`;
let tmrProx=null;
async function proximoCulto(){
  clearInterval(tmrProx);
  if(!document.getElementById('prox'))return;
  let l=[];
  try{const r=await sb.from('cultos').select('nome,data,hora_inicio').gte('data',ds(new Date())).order('data').order('hora_inicio').limit(12);l=r.data||[]}catch(e){}
  const ag=Date.now(),it=l.map(c=>({c,t:new Date(c.data+'T'+c.hora_inicio.slice(0,5)+':00').getTime()}));
  const andamento=it.filter(x=>x.t<=ag&&ag-x.t<4*3600e3).pop();
  const alvo=andamento||it.find(x=>x.t>ag);
  const al=document.getElementById('prox');
  if(!alvo||!al)return;
  const c=alvo.c,hoje=ds(new Date()),am=ds(new Date(Date.now()+864e5));
  const dia=c.data===hoje?'Hoje':c.data===am?'Amanhã':new Date(c.data+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
  al.hidden=false;
  al.innerHTML='<span class="lb">'+(andamento?'Acontecendo agora':'Próximo culto')+'</span><b></b><span class="qd"></span>'+(andamento?'':'<div class="ct" id="ct"></div>');
  al.querySelector('b').textContent=c.nome;
  al.querySelector('.qd').textContent=dia+' às '+c.hora_inicio.slice(0,5);
  if(andamento)return;
  const p2=n=>String(n).padStart(2,'0');
  const tick=()=>{
    const e=document.getElementById('ct');if(!e){clearInterval(tmrProx);return}
    const s=Math.floor(Math.max(0,alvo.t-Date.now())/1000);
    const dd=Math.floor(s/86400),hh=Math.floor(s%86400/3600),mm=Math.floor(s%3600/60),ss=s%60;
    e.textContent=(dd?dd+' d ':'')+p2(hh)+':'+p2(mm)+':'+p2(ss);
  };
  tick();tmrProx=setInterval(tick,1000);
}
function entradaUI(){
  const caixa=document.querySelector('.entrada .box');
  const aviso=(t,ok)=>{const e=$('#er');e.textContent=t;e.className='err'+(ok?' ok':'')};
  const erro=t=>{aviso(t);caixa.classList.remove('trem');void caixa.offsetWidth;caixa.classList.add('trem')};
  return {aviso,erro};
}
function olhoSenha(){
  $('#ver').onclick=()=>{const p=$('#pw'),v=p.type==='password';p.type=v?'text':'password';$('#ver').setAttribute('aria-label',v?'Ocultar senha':'Mostrar senha')};
}
function definirSenha(msg=''){
  clearInterval(timer);
  $('#app').innerHTML=`<div class="entrada">${ladoHTML()}<div class="box"><h1>Definir senha</h1><p class="vz" style="margin:0">Escolha a senha que você vai usar para entrar.</p><p class="err" id="er">${esc(msg)}</p><form id="fm"><div class="fl sn"><input id="s1" type="password" placeholder=" " autocomplete="new-password"><label for="s1">Nova senha</label></div><div class="fl"><input id="s2" type="password" placeholder=" " autocomplete="new-password"><label for="s2">Repita a senha</label></div><div class="row"><button class="p" id="go" type="submit">Salvar senha</button></div></form></div></div>`;
  const {erro}=entradaUI();
  $('#fm').onsubmit=async e=>{
    e.preventDefault();
    const a=$('#s1').value,b=$('#s2').value;
    if(a.length<6){erro('Use pelo menos 6 caracteres.');return}
    if(a!==b){erro('As senhas não conferem.');return}
    const btn=$('#go');btn.disabled=true;btn.textContent='Salvando…';
    const {error}=await sb.auth.updateUser({password:a});
    if(error){btn.disabled=false;btn.textContent='Salvar senha';erro(error.message);return}
    precisaSenha=false;history.replaceState(null,'',location.pathname);admin();
  };
  proximoCulto();
}
function login(msg='',ok=false){
  clearInterval(timer);
  $('#app').innerHTML=`<div class="entrada">${ladoHTML()}<div class="box"><h1>Entrar</h1><p class="vz" style="margin:0">Acesse o cronograma e o painel ao vivo.</p><p class="err${ok?' ok':''}" id="er">${esc(msg)}</p><form id="fm"><div class="fl"><input id="em" type="email" placeholder=" " autocomplete="username"><label for="em">E-mail</label></div><div class="fl sn"><input id="pw" type="password" placeholder=" " autocomplete="current-password"><label for="pw">Senha</label><button type="button" class="ol" id="ver" aria-label="Mostrar senha">${OLHO}</button></div><p class="aviso" id="caps" hidden>Caps Lock ligado</p><div class="row"><button class="p" id="go" type="submit">Entrar</button><button class="g" id="esq" type="button">Esqueci a senha</button></div></form></div></div>`;
  const {aviso,erro}=entradaUI();
  olhoSenha();
  const caps=e=>{$('#caps').hidden=!(e.getModifierState&&e.getModifierState('CapsLock'))};
  $('#pw').addEventListener('keydown',caps);$('#pw').addEventListener('keyup',caps);
  $('#esq').onclick=async()=>{
    const em=$('#em').value.trim();
    if(!em){erro('Digite seu e-mail e clique em Esqueci a senha.');return}
    const {error}=await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});
    error?erro(error.message):aviso('Enviamos um link para o seu e-mail. Abra o link neste mesmo navegador.',true);
  };
  $('#fm').onsubmit=async e=>{
    e.preventDefault();
    const em=$('#em').value.trim(),pw=$('#pw').value;
    if(!em||!pw){erro('Digite o e-mail e a senha.');return}
    const b=$('#go');b.disabled=true;b.textContent='Entrando…';
    const {error}=await sb.auth.signInWithPassword({email:em,password:pw});
    if(error){b.disabled=false;b.textContent='Entrar';erro(ERR_LOGIN[error.message]||error.message);$('#pw').value='';$('#pw').focus();return}
    b.textContent='Bem-vindo';
    document.querySelector('.entrada').classList.add('abre');
    await new Promise(r=>setTimeout(r,650));
    admin();
  };
  if(matchMedia('(min-width:821px)').matches)$('#em').focus();
  proximoCulto();
}
async function usuarios(){
  if(papel!=='admin'){lista();return}
  vista='usuarios';clearInterval(timer);document.onkeydown=null;
  const [r,u0]=await Promise.all([sb.from('perfis').select('*').order('email'),sb.auth.getSession()]);
  const data=r.data||[],eu=u0.data.session&&u0.data.session.user;
  const rows=data.map(u=>{

  let it=[],st={idx:0,t0:null},fim='';
  async function carregar(){
    const [a,b,c]=await Promise.all([sb.from('itens').select('*').eq('culto_id',id).order('ordem'),sb.from('live_state').select('*').eq('culto_id',id).maybeSingle(),sb.from('cultos').select('hora_inicio').eq('id',id).maybeSingle()]);
    it=(a.data||[]).filter(x=>x.tipo!=='header');const s=b.data;
    st=s?{idx:s.idx,t0:s.t0?new Date(s.t0).getTime():null}:{idx:0,t0:null};
    fim=c.data?hm(toMin(c.data.hora_inicio.slice(0,5))+it.reduce((x,y)=>x+Number(y.minutos),0)):'';
  }
  function draw(){
    const i=it[st.idx],lt=$('#lt');
    if(!i){$('#cr').textContent='';$('#nx').textContent='';$('#fn').textContent='';return}
    const rem=i.minutos*60-(st.t0?(Date.now()-st.t0)/1000:0);
    $('#cr').textContent=(rem<0?'-':'')+fmt(rem);
    $('#cr').classList.toggle('neg',rem<0);lt.classList.toggle('neg',rem<0);
    $('#fn').textContent=fim?'serviço finaliza às '+fim:'';
    const n=it[st.idx+1];
    $('#nx').textContent=n?'A seguir: '+n.nome:'Último item';
  }
  const tela=()=>{if(document.fullscreenElement)document.exitFullscreen();else if(document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{})};
  $('#fsb').onclick=tela;$('#lt').ondblclick=tela;
  addEventListener('keydown',e=>{if(e.key==='f'||e.key==='F')tela()});
  await carregar();
  sb.channel('l'+id).on('postgres_changes',{event:'*',schema:'public',table:'live_state',filter:'culto_id=eq.'+id},carregar).subscribe();
  setInterval(carregar,10000);
  setInterval(draw,250);draw();
}
</script>
</body>
</html>
